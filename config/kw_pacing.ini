[pacing]
; Universal defaults for human and bot processes. 0 disables patch and timer.
enabled=1
; Change only stock zero-duration waits: 1 = Sleep(1), 0 = stock Sleep(0).
; Nonzero native waits are forwarded unchanged. Restart required.
zero_sleep_delay_ms=1

; Optional Windows 1 ms timer-resolution request. Default 1 requests 1 ms.
timer1=1

; Optional WAIT samples in the per-process framework log. Off for normal play.
pacing_diagnostics=0

; Optional per-role overrides. Omitted values inherit [pacing].
; Managed bots use the headless loader role even when rendering is enabled.
; [pacing.rendered]
; zero_sleep_delay_ms=0
; [pacing.headless]
; zero_sleep_delay_ms=1
